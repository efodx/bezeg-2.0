name: Browser smoke

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# The checks run as parallel jobs: static checks, two Vitest shards, and the build feeding four Chromium smoke shards;
# the `smoke` job gates them as one check.
# Each job cancels the same job of an obsolete run; the group names a shard so shards of one run never cancel each other.
# The deploy job is not cancelled.

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}-scope
      cancel-in-progress: true
    outputs:
      full_verification: ${{ steps.scope.outputs.full_verification }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide verification scope
        id: scope
        run: node scripts/ci-change-scope.cjs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Test verification scope detector
        run: node --test scripts/ci-change-scope.test.cjs

  checks:
    needs: scope
    if: needs.scope.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npx eslint .

  unit:
    needs: scope
    if: needs.scope.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The PartSequencer in vite.config.mts spreads the *.partN.test.* files over the shards.
        shard: [1, 2]
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}-unit-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unit tests (shard ${{ matrix.shard }}/2)
        run: npm test -- --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'

  build:
    needs: scope
    if: needs.scope.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build production app
        run: npm run build
      # Every smoke shard tests this build, and only this build is deployed.
      - name: Upload build for smoke shards
        uses: actions/upload-artifact@v6
        with:
          name: production-build
          path: build/
          include-hidden-files: true
          retention-days: 1
      - name: Upload Pages artifact
        if: github.repository == 'efodx/bezeg-2.0' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  chromium:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Playwright's --shard splits by test count, but a guided-lesson test takes about four times as long as the
      # others. Three shards each run a third of the guided lessons; the fourth runs every other spec.
      matrix:
        include:
          - shard: lessons-1
            args: tests/guided-lessons.smoke.spec.cjs --shard=1/3
          - shard: lessons-2
            args: tests/guided-lessons.smoke.spec.cjs --shard=2/3
          - shard: lessons-3
            args: tests/guided-lessons.smoke.spec.cjs --shard=3/3
          - shard: other-specs
            ignore: '**/guided-lessons.smoke.spec.cjs'
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}-chromium-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image already has Chromium's libraries; `--with-deps` only added fonts through apt, whose mirror
      # sometimes crawls (8.5 min on one shard). Fall back to apt only when a browser binary lacks a library.
      - name: Install Chromium
        run: |
          npx playwright install chromium
          if find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} + | grep -q 'not found'; then
            npx playwright install-deps chromium
          fi
      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: build
      - name: Run Chromium smoke tests (${{ matrix.shard }})
        run: npm run test:smoke:built -- ${{ matrix.args }}
        env:
          CI: 'true'
          SMOKE_TEST_IGNORE: ${{ matrix.ignore }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-failure-evidence-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  # The `smoke` check: passes when every check job succeeded, or when the scope skipped them for documentation.
  smoke:
    needs: [scope, checks, unit, build, chromium]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check job
        env:
          FULL_VERIFICATION: ${{ needs.scope.outputs.full_verification }}
          RESULTS: ${{ needs.scope.result }} ${{ needs.checks.result }} ${{ needs.unit.result }} ${{ needs.build.result }} ${{ needs.chromium.result }}
        run: |
          echo "Job results (scope checks unit build chromium): $RESULTS"
          if [ "$FULL_VERIFICATION" = 'false' ] && [ "${RESULTS%% *}" = 'success' ]; then exit 0; fi
          for result in $RESULTS; do [ "$result" = 'success' ] || exit 1; done

  deploy:
    needs: [scope, smoke]
    # Without a status function the condition also requires both needed jobs to succeed.
    if: needs.scope.outputs.full_verification == 'true' && github.repository == 'efodx/bezeg-2.0' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
