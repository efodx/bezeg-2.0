name: Browser smoke

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      full_verification: ${{ steps.scope.outputs.full_verification }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide verification scope
        id: scope
        run: node scripts/ci-change-scope.cjs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Test verification scope detector
        run: node --test scripts/ci-change-scope.test.cjs
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.full_verification == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.full_verification == 'true'
      - name: Check TypeScript
        if: steps.scope.outputs.full_verification == 'true'
        run: npx tsc --noEmit --pretty false
      - name: Lint
        if: steps.scope.outputs.full_verification == 'true'
        run: npx eslint .
      - name: Run unit tests
        if: steps.scope.outputs.full_verification == 'true'
        run: npm test
        env:
          CI: 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.full_verification == 'true'
      - name: Build production app
        if: steps.scope.outputs.full_verification == 'true'
        run: npm run build
      - name: Run Chromium smoke tests
        if: steps.scope.outputs.full_verification == 'true'
        run: npm run test:smoke:built
        env:
          CI: 'true'
      - name: Upload verified Pages artifact
        if: success() && steps.scope.outputs.full_verification == 'true' && github.repository == 'efodx/bezeg-2.0' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - name: Upload failure evidence
        if: failure() && steps.scope.outputs.full_verification == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  deploy:
    needs: smoke
    if: needs.smoke.result == 'success' && needs.smoke.outputs.full_verification == 'true' && github.repository == 'efodx/bezeg-2.0' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
