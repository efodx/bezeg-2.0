name: Developer tools

on:
  pull_request:
    branches: [master]
    paths:
      - justfile
      - scripts/commands*.cjs
      - tools/agent-usage/codex_worker_watch*.cjs
      - tools/agent-eval/**
      - .github/workflows/developer-tools.yml
      - package.json
      - package-lock.json
      - .nvmrc
  push:
    branches: [master]
    paths:
      - justfile
      - scripts/commands*.cjs
      - tools/agent-usage/codex_worker_watch*.cjs
      - tools/agent-eval/**
      - .github/workflows/developer-tools.yml
      - package.json
      - package-lock.json
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install just 1.59.0
        shell: pwsh
        run: |
          $archive = if ($IsWindows) { 'just-1.59.0-x86_64-pc-windows-msvc.zip' } else { 'just-1.59.0-x86_64-unknown-linux-musl.tar.gz' }
          $expected = if ($IsWindows) { '9c5463e2d0974e31bee71346aa5cbf19167de1585a4abc1bae7b3b04604ea9c0' } else { '409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e' }
          $destination = Join-Path $env:RUNNER_TEMP 'bezeg-just'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $download = Join-Path $destination $archive
          Invoke-WebRequest "https://github.com/casey/just/releases/download/1.59.0/$archive" -OutFile $download
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'just archive checksum mismatch' }
          if ($IsWindows) { Expand-Archive -LiteralPath $download -DestinationPath $destination } else { tar -xzf $download -C $destination; if ($LASTEXITCODE -ne 0) { throw 'just extraction failed' } }
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $binary = Join-Path $destination $(if ($IsWindows) { 'just.exe' } else { 'just' })
          "JUST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: just --list
      - run: just tooling-test
      - name: Test Codex worker budget watcher
        run: node --test tools/agent-usage/codex_worker_watch.test.cjs
      - name: Test workflow evaluation harness
        run: node --test tools/agent-eval/agent_eval.test.cjs
      - name: Exercise focused unit forwarding
        run: just unit src/learning/content/lessonMathNotation.test.ts -t "scans every lesson|lesson prose wraps"
      - name: Upload command logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: command-logs-${{ matrix.os }}
          path: .command-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
