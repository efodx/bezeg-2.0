name: Repository graph

on:
  pull_request:
    branches: [master]
    paths:
      - tools/repo-graph/**
      - src/**
      - public/**
      - '**/*.md'
      - docs/**
      - GLOSSARY.md
      - AGENTS.md
      - tsconfig*.json
      - package*.json
      - justfile
      - .gitignore
      - .github/workflows/repository-graph.yml
  push:
    branches: [master]
    paths:
      - tools/repo-graph/**
      - src/**
      - public/**
      - '**/*.md'
      - docs/**
      - GLOSSARY.md
      - AGENTS.md
      - tsconfig*.json
      - package*.json
      - justfile
      - .gitignore
      - .github/workflows/repository-graph.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test deterministic extraction and bounded pilot with fake inference
        run: node --test tools/repo-graph/*.test.cjs
      - name: Build structural graph without credentials or inference
        run: node tools/repo-graph/cli.cjs build
      - name: Check current extraction status
        run: node tools/repo-graph/cli.cjs status
      - name: Query current source without account access
        run: node tools/repo-graph/cli.cjs query "synchronous lesson scene actions" --max-chars 8000 --max-results 4
