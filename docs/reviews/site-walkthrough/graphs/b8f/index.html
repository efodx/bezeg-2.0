<h1>Batch B8f: capture-tool repairs (G03, G04)</h1><h2>1. projective-pascal</h2><p>Remove: the line labels s1..s6 and p now go with the rest of the text (capture tool judged only text objects before, not line labels).</p><div class="pair"><figure><figcaption>Before</figcaption><img src="before/projective-pascal.png" style="width:100%;height:auto;display:block" alt=""></figure><figure><figcaption>After</figcaption><img src="after/projective-pascal.png" style="width:100%;height:auto;display:block" alt=""></figure></div>
<h2>2. linear-map</h2><p>Keep in part: a1 = (2, 1), a2 stay; the clip colour check samples a pure background pixel (611, 11).</p><div class="pair"><figure><figcaption>Before</figcaption><video src="before/linear-map.webm" poster="before/linear-map.png" autoplay loop muted playsinline></video></figure><figure><figcaption>After</figcaption><video src="after/linear-map.webm" poster="after/linear-map.png" autoplay loop muted playsinline></video></figure></div>
