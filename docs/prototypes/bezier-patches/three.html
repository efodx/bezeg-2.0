<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bézier patch renderer spike — three.js</title>
  <link rel="stylesheet" href="./three-style.css">
</head>
<body>
  <header>
    <strong>Bézier patch renderer spike — three.js r180</strong>
    <label>Patch <select id="kind"><option value="tensor">Bicubic tensor (16)</option><option value="triangular">Cubic triangular (10)</option><option value="teapot">Utah teapot (32 bicubic)</option></select></label>
    <label>Iso grid <select id="iso"><option>8</option><option>16</option></select></label>
    <label>Shading <select id="tiling"><option>8</option><option>16</option></select></label>
    <label><input id="show-iso" type="checkbox" checked> iso curves</label>
    <label><input id="show-net" type="checkbox" checked> net</label>
    <label><input id="z-mode" type="checkbox"> z drag mode</label>
    <button data-view="front">Front</button><button data-view="top">Top</button><button data-view="side">Side</button><button data-view="isometric">Isometric</button>
    <button id="reset">Reset</button><button id="presentation">Presentation size</button><button id="export-svg">SVG</button><button id="export-png">PNG</button><button id="remount">Dispose / remount</button>
  </header>
  <main>
    <section id="main-board" tabindex="0" aria-label="3D Bézier patch; focus here and use arrow keys to orbit"><div id="status">Loading isolated three.js modules…</div><div id="labels"></div></section>
    <aside>
      <div><b>Parameter domain</b><span id="uv-label"></span></div>
      <canvas id="domain-board" aria-label="Parameter domain; drag to set u and v"></canvas>
      <p>Drag empty space to orbit. Drag a net point in the XY plane; toggle z mode before dragging to change its height. Focus the graph and use arrow keys to orbit.</p>
      <pre id="readout"></pre>
      <button id="stress">Show actual 32-patch teapot</button><button id="clear-stress">Clear teapot</button>
    </aside>
  </main>
  <script type="module" src="./three-prototype.js"></script>
</body>
</html>
