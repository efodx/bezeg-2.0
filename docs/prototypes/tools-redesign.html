<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bezeg tools redesign concepts</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #263127; background: #f4f5ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 20px clamp(18px, 4vw, 56px) 15px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-size: 19px; margin: 0; color: #264901; }
    #description { color: #667064; font-size: 14px; }
    main { padding: 0 clamp(12px, 3vw, 42px) 96px; }
    #visual { display: block; width: 100%; max-width: 1440px; height: auto; margin: 0 auto; border-radius: 14px; box-shadow: 0 18px 50px #2631271c; background: #fffefa; }
    .note { max-width: 1440px; margin: 14px auto; color: #667064; font-size: 13px; }
    .switcher { position: fixed; z-index: 10; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #d9decc; border-radius: 999px; background: #203025; color: white; box-shadow: 0 8px 30px #18231c55; }
    .switcher button { border: 0; border-radius: 999px; padding: 9px 13px; color: #203025; background: #f7f5e7; font-size: 14px; cursor: pointer; }
    .switcher button:focus-visible { outline: 3px solid #d6ddaa; outline-offset: 2px; }
    #current { min-width: 230px; text-align: center; font-size: 13px; }
    @media (max-width: 600px) { header { display: block; } #description { display:block; margin-top: 5px; } #current { min-width: 152px; font-size: 12px; } .switcher button { padding: 9px 11px; } }
  </style>
</head>
<body>
  <header>
    <h1>Bezeg · vizualni predlog orodij</h1>
    <span id="description">Izberi razporeditev. Uporabi lahko tudi tipki ← in →.</span>
  </header>
  <main>
    <img id="visual" src="tools-redesign-a-inspector.svg" alt="Mockup of a unified curve inspector layout">
    <p class="note">Statičen vizualni koncept. Graf in prikazani kontrolniki so ilustracija; ne spreminjajo matematične krivulje ali shranjenih primerov.</p>
  </main>
  <nav class="switcher" aria-label="Izbira predloga">
    <button id="previous" type="button" aria-label="Prejšnji predlog">←</button>
    <span id="current" aria-live="polite"></span>
    <button id="next" type="button" aria-label="Naslednji predlog">→</button>
  </nav>
  <script>
    const variants = [
      { key: "a", image: "tools-redesign-a-inspector.svg", name: "A · Enoten pregledovalnik" },
      { key: "b", image: "tools-redesign-b-guided.svg", name: "B · Vodena učna pot" },
      { key: "c", image: "tools-redesign-c-presentation.svg", name: "C · Graf za predstavitev" },
      { key: "mobile", image: "tools-redesign-mobile.svg", name: "Mobilni pogled" }
    ];
    let index = Math.max(0, variants.findIndex(item => item.key === new URLSearchParams(location.search).get("variant")));
    const visual = document.getElementById("visual");
    const current = document.getElementById("current");
    function show(nextIndex) {
      index = (nextIndex + variants.length) % variants.length;
      const item = variants[index];
      visual.src = item.image;
      visual.alt = item.name;
      current.textContent = item.name;
      history.replaceState(null, "", `${location.pathname}?variant=${item.key}`);
    }
    document.getElementById("previous").addEventListener("click", () => show(index - 1));
    document.getElementById("next").addEventListener("click", () => show(index + 1));
    document.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === "ArrowLeft") show(index - 1);
      if (event.key === "ArrowRight") show(index + 1);
    });
    show(index);
  </script>
</body>
</html>
