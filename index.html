<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8"/>
    <link href="%BASE_URL%favicon.ico" rel="icon" sizes="48x48"/>
    <link href="%BASE_URL%favicon.svg" rel="icon" sizes="any" type="image/svg+xml"/>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="#f7f5e9" name="theme-color"/>
    <meta
            content="Bezeg – raziskovanje lastnosti Bézierjevih in PH krivulj."
            name="description"
    />

    <link href="%BASE_URL%apple-touch-icon.png" rel="apple-touch-icon"/>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link href="%BASE_URL%manifest.json" rel="manifest"/>
    <!-- The display face is on every page, so fetch it with the page: the Home headline then keeps its place. -->
    <link as="font" crossorigin href="/src/fonts/literata/literata-latin-normal.woff2" rel="preload" type="font/woff2"/>
    <link as="font" crossorigin href="/src/fonts/literata/literata-latin-ext-normal.woff2" rel="preload" type="font/woff2"/>
    <title>Bezeg</title>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script src="%BASE_URL%history-entry-bridge.js" type="text/javascript"></script>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (window.BezegHistoryEntryBridge) window.BezegHistoryEntryBridge.restoreRedirect();
        else if (l.search[1] === '/') {
          var redirect = l.search.slice(1)
          var decoded
          if (redirect.indexOf('/~v2~') === 0) {
            try { decoded = decodeURIComponent(redirect.slice(5)) } catch (_) { decoded = '' }
          } else {
            decoded = redirect.split('&').map(function (s) {
              return s.replace(/~and~/g, '&')
            }).join('?')
          }
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
</head>
<body style="background-color: var(--bezeg-background);">
<noscript>Za uporabo Bezega omogoči JavaScript. <span lang="en">Enable JavaScript to use Bezeg.</span></noscript>

<div id="root"></div>
<script src="/src/index.tsx" type="module"></script>
</body>
</html>
